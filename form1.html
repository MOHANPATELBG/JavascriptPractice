<!DOCTYPE html>
<html lang="en">
<head></head>
    <title>Registration Form</title>
</head>
<body>
    <form action="Registration.php" method="post" name="registrationForm">
        Full Name: <input type="text" name="name"><br><br>
        First Name: <input type="text" name="fname"><br><br>
        Last Name: <input type="text" name="lname"><br><br>
        Date of Birth: <input type="date" name="dob"><br><br>
        Gender: <input type="radio" name="gender" group="gender" value="Male">Male
        <input type="radio" name="gender" group="gender" value="Female">Female<br><br>
        Education: <select name="education">
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="Graduation">Graduation</option>
            <option value="Post Graduation">Post Graduation</option>
        </select><br><br>
        Hobbies: <input type="checkbox" name="hobbies" value="Reading">Reading
        <input type="checkbox" name="hobbies" value="Writing">Writing

        Email: <input type="email" name="email"><br><br>
        password: <input type="password" name="password"><br><br>
        Contact Number: <input type="number" name="contact"><br><br>

    </form>

</html>
